<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 核心：移动端视口适配，AI看到这个就知道需要做响应式 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>移动端App底部导航栏 (Bottom Navigation)</title>
    <style>
        /* ==================================================
           移动端 App 底部导航栏 (App Bottom Navigation Bar)
           需求：适配所有尺寸手机（1080P, 2K 等），固定在底部
           ================================================== */

        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; 
        }

        /* 【调试用】当前为了预览方便，将底栏居中。AI优化时可改为固定在屏幕底部（position: fixed; bottom: 0;） */
        body {
            background-color: #f5f5f5;
            height: 100dvh; /* 使用 dvh 解决移动端浏览器地址栏导致的 100vh 撑破问题 */
            display: flex;
            justify-content: center;
            align-items: center; 
            overflow: hidden;
        }

        /* ================= 核心组件：底栏容器 ================= */
        .bottom-nav {
            width: 100%; /* 手机端撑满宽度 */
            max-width: 500px; /* 限制平板或横屏时的最大宽度 */
            height: 110px; /* 底栏高度，可通过 min-height 改为自适应 */
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            
            /* 移动端安全区适配：防止被 iPhone 底部小白条或安卓手势条遮挡 */
            padding: 8px 0 env(safe-area-inset-bottom, 10px) 0; 
            
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        /* 单个导航项 (Tab) */
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #666666;
            font-size: 11px;
            flex: 1;
            gap: 2px;
            cursor: pointer;
            user-select: none;
        }

        /* 图标容器 */
        .nav-icon {
            width: 44px; 
            height: 44px; 
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent; 
            transition: background-color 0.3s ease; 
        }

        /* SVG 图标 */
        .nav-icon svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-item span {
            line-height: 1;
            transition: font-weight 0.2s ease, color 0.2s ease;
        }

        /* ================= 激活状态 (Active State) ================= */
        .nav-item.active {
            color: #1b8a3e; 
        }

        .nav-item.active .nav-icon {
            background-color: #d1f0bd; 
        }

        .nav-item.active span {
            font-weight: 600; 
        }

        /* 针对“素材”照片图标的特殊处理 */
        .nav-item.active .nav-icon svg.icon-material .bg-shape {
            fill: currentColor;
            stroke: none;
        }
        .nav-item.active .nav-icon svg.icon-material .cutout {
            fill: #d1f0bd; 
            stroke: none;
        }
    </style>
</head>
<body>

    <!-- 【组件名】App Bottom Navigation -->
    <nav class="bottom-nav">
        
        <!-- Tab 1: 报价 -->
        <a class="nav-item">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="5" y="3" width="14" height="18" rx="2" />
                    <rect x="8" y="6" width="8" height="4" rx="1" />
                    <circle cx="8.5" cy="14" r="1.2" />
                    <circle cx="12" cy="14" r="1.2" />
                    <circle cx="15.5" cy="14" r="1.2" />
                    <circle cx="8.5" cy="18" r="1.2" />
                    <circle cx="12" cy="18" r="1.2" />
                    <circle cx="15.5" cy="18" r="1.2" />
                </svg>
            </div>
            <span>报价</span>
        </a>

        <!-- Tab 2: 素材 (默认激活) -->
        <a class="nav-item active">
            <div class="nav-icon">
                <svg class="icon-material" viewBox="0 0 24 24">
                    <rect class="bg-shape" x="3" y="3" width="18" height="18" rx="2" />
                    <circle class="cutout" cx="8.5" cy="8.5" r="1.5" />
                    <path class="cutout" d="M21 15 l-5 -5 L5 21" />
                </svg>
            </div>
            <span>素材</span>
        </a>

        <!-- Tab 3: 规格 -->
        <a class="nav-item">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="7" />
                    <line x1="16" y1="16" x2="21" y2="21" />
                </svg>
            </div>
            <span>规格</span>
        </a>

        <!-- Tab 4: 对账 -->
        <a class="nav-item">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="5" y="5" width="14" height="14" rx="4" />
                    <line x1="12" y1="8" x2="12" y2="16" />
                    <line x1="8" y1="12" x2="16" y2="12" />
                </svg>
            </div>
            <span>对账</span>
        </a>

        <!-- Tab 5: 个人 -->
        <a class="nav-item">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" />
                    <circle cx="12" cy="10" r="3" />
                    <path d="M6.5 18 C8 15.5 10 14.5 12 14.5 C14 14.5 16 15.5 17.5 18" />
                </svg>
            </div>
            <span>个人</span>
        </a>

    </nav>

    <!-- Tab 切换交互逻辑 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navItems = document.querySelectorAll('.nav-item');
            
            navItems.forEach(item => {
                item.addEventListener('click', function() {
                    // 移除所有 tab 的 active 类
                    navItems.forEach(nav => nav.classList.remove('active'));
                    // 给当前点击的 tab 添加 active 类
                    this.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
