name: Build & Release APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 0.1.0)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_STORE_FILE: app/release-key.jks
      SIGNING_STORE_PASSWORD: ay111128
      SIGNING_KEY_ALIAS: key0
      SIGNING_KEY_PASSWORD: ay111128
      GRADLE_WRAPPER_DISABLE_VALIDATION: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
          validate-wrappers: false

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --build-cache

      - name: Package & verify
        run: |
          VERSION=${{ steps.version.outputs.version }}
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK_FILE" paperbox-v${VERSION}.apk
          echo "📦 $(ls -lh paperbox-v${VERSION}.apk)"
          jarsigner -verify paperbox-v${VERSION}.apk 2>&1 | tail -1

      - name: Generate release body
        id: body
        run: |
          BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo "## 📦 飞机盒报价工具 (Paperbox)"
            echo ""
            echo "**最新构建**：${BUILD_TIME}（${SHORT_SHA}）"
            echo ""
            echo "### 下载安装"
            echo "1. 点击下方 APK 文件下载"
            echo '2. 在手机上打开安装（需允许"未知来源"）'
            echo "3. 如已安装旧版本，直接覆盖安装即可"
            echo ""
            echo "### 功能"
            echo "- 🏠 报价计算（长宽高、数量、利润、现货匹配）"
            echo "- 📐 尺寸规格（硬编码价格/克重表）"
            echo "- 🎨 素材管理（上传/预览/下载/查重）"
            echo "- 📊 对账分析（Excel 导入导出）"
            echo "- 🔐 登录注册（账号管理）"
          } > release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release_body.md
          files: paperbox-v${{ steps.version.outputs.version }}.apk
          make_latest: true
          overwrite_files: true
