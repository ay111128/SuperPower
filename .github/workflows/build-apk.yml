name: Build & Release APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 0.1.0)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_STORE_FILE: app/release-key.jks
      SIGNING_STORE_PASSWORD: ay111128
      SIGNING_KEY_ALIAS: key0
      SIGNING_KEY_PASSWORD: ay111128

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Diagnostic - Verify keystore
        run: |
          echo "=== Keystore check ==="
          keytool -list -keystore $SIGNING_STORE_FILE -storepass $SIGNING_STORE_PASSWORD 2>&1 | grep -E "Keystore type|entry|key0"

      - name: Get version from build.gradle.kts
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signing
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK_FILE"
          ls -lh "$APK_FILE"
          echo ""
          # Verify signature
          jarsigner -verify -verbose -certs "$APK_FILE" 2>&1 | tail -3
          echo ""
          # Check v2/v3 with apksigner
          APKSIGNER=$(find /usr/local/lib/android -name "apksigner" 2>/dev/null | head -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_FILE" 2>&1 | head -5
          fi

      - name: Package APK
        run: |
          VERSION=${{ steps.version.outputs.version }}
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK_FILE" paperbox-v${VERSION}.apk
          echo "📦 Final APK: $(ls -lh paperbox-v${VERSION}.apk)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: paperbox-v${{ steps.version.outputs.version }}.apk
          make_latest: true
          overwrite_files: true
