name: Build & Release APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 0.1.0)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_STORE_FILE: app/release-key.jks
      SIGNING_STORE_PASSWORD: ay111128
      SIGNING_KEY_ALIAS: key0
      SIGNING_KEY_PASSWORD: ay111128

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --build-cache

      - name: Package & verify
        run: |
          VERSION=${{ steps.version.outputs.version }}
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK_FILE" paperbox-v${VERSION}.apk
          echo "📦 $(ls -lh paperbox-v${VERSION}.apk)"
          jarsigner -verify paperbox-v${VERSION}.apk 2>&1 | tail -1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: paperbox-v${{ steps.version.outputs.version }}.apk
          make_latest: true
          overwrite_files: true
